# CI do deVerb: compila Standalone+VST3(+LV2 no Linux, +AU no Mac),
# corre testes + validadores e publica os binários como artefactos.
# macOS corre em runner cloud (10x minutos) — por isso este workflow corre
# em push/PR, e os artefactos mac servem para uso próprio (ad-hoc signed).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: linux
            formats: "Standalone;VST3;LV2"
          - os: macos-14
            triplet: mac
            formats: "Standalone;VST3;AU"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: deverb-${{ matrix.triplet }}

      - name: Configure plugin
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDEVERB_FORMATS="${{ matrix.formats }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }}

      - name: Build plugin
        run: cmake --build build

      - name: Ad-hoc sign (macOS, precisa o auval carregar no ARM)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - build/deVerb_artefacts/Release/VST3/deVerb.vst3
          codesign --force --deep -s - build/deVerb_artefacts/Release/Standalone/deVerb.app || true
          codesign --force --deep -s - $(find build -name "*.component" -maxdepth 4 | head -1)

      - name: Configure + build tests
        run: >
          cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }}
          && cmake --build tests/build --target test_dsp test_chain test_ui

      - name: Run DSP + chain tests
        run: ./tests/build/test_dsp && ./tests/build/test_chain

      - name: Run UI session tests (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./tests/build/test_ui

      # O runner mac tem WindowServer: o test_ui corre direto e diz-nos se
      # o crash do pluginval/Editor é do editor em si ou só do hosting VST3.
      # lldb só em falha (o `bt` com processo já saído dava exit 1 espúrio).
      - name: Run UI session tests (macOS)
        if: runner.os == 'macOS'
        run: |
          ./tests/build/test_ui
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "test_ui falhou (exit $CODE); a repetir sob lldb para a stack:"
            lldb --batch -o "run" -o "bt all" -o "quit" -- ./tests/build/test_ui || true
          fi
          exit $CODE

      - name: pluginval
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -sL -o /tmp/pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          else
            curl -sL -o /tmp/pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          fi
          rm -rf /tmp/pv && mkdir -p /tmp/pv && unzip -o -q /tmp/pv.zip -d /tmp/pv
          PV=$(find /tmp/pv -name pluginval -type f | head -1)
          if [ -z "$PV" ]; then
            PV=$(find /tmp/pv -name "pluginval*" -type d | head -1)/Contents/MacOS/pluginval
          fi
          echo "pluginval em: $PV" && chmod +x "$PV"
          VST3=$(find build -name "*.vst3" -maxdepth 4 | head -1)
          if [ "${{ runner.os }}" = "Linux" ]; then
            # pluginval incorpora o editor via XEmbed e rebenta sem display.
            xvfb-run -a "$PV" --validate "$VST3" --strictness-level 5
          else
            # lldb só em falha (o `bt` com processo já saído dava exit 1 espúrio).
            "$PV" --validate "$VST3" --strictness-level 5
            CODE=$?
            if [ $CODE -ne 0 ]; then
              echo "pluginval falhou (exit $CODE); a repetir sob lldb para a stack:"
              lldb --batch -o "run" -o "bt all" -o "quit" -- "$PV" --validate "$VST3" --strictness-level 5 || true
            fi
            exit $CODE
          fi

      # Em falha no mac: despeja os crash reports (.ips) dos nossos processos
      # com a stack da thread que estoirou (para diagnosticar sem mac local).
      - name: Dump crash reports (macOS, em falha)
        if: failure() && runner.os == 'macOS'
        run: |
          # O crashreportd demora uns segundos a escrever o .ips; esperar.
          sleep 25
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -12 || echo "sem DiagnosticReports"
          python3 - <<'PYEOF'
          import json, glob, os
          pat = os.path.expanduser('~/Library/Logs/DiagnosticReports/*.ips')
          files = sorted(glob.glob(pat), key=os.path.getmtime, reverse=True)
          print('ficheiros .ips recentes:', len(files))
          shown = 0
          for f in files:
              base = os.path.basename(f)
              if not any(k in base for k in ('pluginval', 'test_ui', 'deVerb', 'auval')):
                  continue
              try:
                  d = json.load(open(f))
              except Exception as e:
                  print('=====', base, '-> ilegivel:', e)
                  continue
              print('=====', base)
              ex = d.get('exception') or {}
              print('  excepcao:', ex.get('type'), '| sinal:', ex.get('signal'),
                    '| subtype:', ex.get('subtype'), '| codes:', ex.get('codes'))
              print('  razao:', (d.get('termination') or {}).get('reason'))
              threads = d.get('threads') or []
              crashed = [t for t in threads if t.get('triggered')]
              if not crashed and isinstance(d.get('faultingThread'), int):
                  crashed = [t for t in threads if t.get('id') == d.get('faultingThread')]
              for t in crashed[:1]:
                  for fr in (t.get('frames') or [])[:45]:
                      sym = fr.get('symbol') or fr.get('imageOffset')
                      src = fr.get('sourceFile') or ''
                      ln = fr.get('sourceLine') or ''
                      print('   ', fr.get('image'), '|', sym, ('| ' + str(src) + ':' + str(ln)) if src else '')
              shown += 1
              if shown >= 3:
                  break
          if shown == 0:
              print('sem .ips dos nossos processos')
          PYEOF

      - name: auval (macOS, AU)
        if: runner.os == 'macOS'
        run: |
          AU=$(find build -name "*.component" -maxdepth 4 | head -1)
          echo "A instalar $AU para o auval encontrar"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/deVerb.component
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          ls ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -a | grep -i deverb || echo "deVerb NÃO listado no auval -a"
          # NOTA: tipo 'aumf' e não 'aufx' — o plugin aceita MIDI, logo o JUCE
          # declara-o como Music Effect (kAudioUnitType_MusicEffect).
          auval -v aumf dVr1 Pdlb

      - name: Upload artefactos
        uses: actions/upload-artifact@v4
        with:
          name: deverb-${{ matrix.triplet }}
          path: build/deVerb_artefacts/Release/
